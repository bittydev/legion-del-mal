name: "Reclutamiento de Agentes"

on: push

jobs: 
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest
        steps:
            - name: "El agente se presenta a la empresa"
              run: echo "Soy ${{ github.actor }}, y estoy listo para trabajar en la empresa"

            - name: "Reporte de identidad del agente"
              run: |
                echo "Reporte de Identidad del Agente"
                echo "-------------------------------"
                echo "Nombre clave: ${{ github.actor }}"
                echo "-------------------------------"
                echo "Repositorios del agente: ${{ github.repository }}"
                echo "Operaciones recientes del agente: ${{ github.event_name }}"
                echo "Metadata del evento: ${{ toJson(github.event) }}"
                echo "-------------------------------"
                echo "${{ toJson(github) }}"
                echo "-------------------------------"
                echo "Fin del reporte de identidad del agente"

            - name: "Capacidades del agente"
              run: |
                echo "Capacidades del Agente"
                echo "----------------------"
                uname -a
                echo "Sistema operativo: ${{ runner.os }}"
                echo "Versión del sistema operativo: ${{ runner.os_version }}"
                echo "Arquitectura del sistema: ${{ runner.arch }}"
                echo "Versión de Node.js: ${{ runner.node_version }}"
                echo "Versión de Python: ${{ runner.python_version }}"
                echo "Versión de Java: ${{ runner.java_version }}"
                echo "----------------------"
                echo "Fin del reporte de capacidades del agente"

            - name: "Reconocimiento del terreno del agente"
              run: |
                echo "Reconocimiento del Terreno del Agente"
                echo "-------------------------------------"
                ls /
                echo "-------------------------------------"
                echo "Fin del reconocimiento del terreno del agente"
